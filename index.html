<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<meta name="theme-color" content="#4f46e5">
<title>○×暗記シート｜主任技師等任用候補者選考</title>
<style>
:root{--bg:#f4f6fa;--card:#fff;--border:#e2e8f0;--text:#111827;--muted:#64748b;--accent:#4f46e5;--accent-bg:#eef2ff;--ok:#15803d;--okbg:#f0fdf4;--ng:#dc2626;--ngbg:#fff1f2}
*{box-sizing:border-box}html{-webkit-text-size-adjust:100%}body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif;padding-bottom:calc(24px + env(safe-area-inset-bottom))}button{font:inherit}.wrap{width:min(100%,820px);margin:auto;padding:0 16px}.topbar{position:sticky;top:0;z-index:20;background:rgba(255,255,255,.97);border-bottom:1px solid var(--border);backdrop-filter:blur(10px)}.head{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:11px 0 9px}.brand h1{font-size:18px;line-height:1.3;margin:0}.brand .sub{font-size:12px;color:var(--muted);margin-top:2px}.portal{display:inline-flex;align-items:center;justify-content:center;text-decoration:none;color:#334155;border:1px solid var(--border);background:#fff;border-radius:11px;padding:8px 11px;font-size:12px;font-weight:800;min-height:40px}.progress-row{display:flex;justify-content:space-between;gap:10px;font-size:12px;font-weight:700;padding-bottom:7px}.progress-row span:last-child{color:var(--muted)}.track{height:6px;background:#e8ecf4;border-radius:999px;overflow:hidden;margin-bottom:10px}.bar{height:100%;width:0;background:var(--accent);transition:width .2s}.controls-panel{padding:14px 0 5px}.control-label{font-size:12px;font-weight:800;color:#475569;margin:0 0 7px}.control-label.spaced{margin-top:14px}.seg,.quick{display:grid;grid-template-columns:repeat(4,1fr);gap:7px}.seg button,.quick button{border:1px solid var(--border);background:#fff;border-radius:11px;padding:9px 5px;font-size:12px;font-weight:800;color:#475569;cursor:pointer}.seg button.active,.quick button.active{background:var(--accent-bg);border-color:#a5b4fc;color:#3730a3}.quick button[data-mode="weak10"].active{background:#fff7ed;border-color:#fdba74;color:#9a3412}.quick button[data-mode="numeric10"].active{background:#eff6ff;border-color:#93c5fd;color:#1d4ed8}.quick button[data-mode="random10"].active{background:#f0fdf4;border-color:#86efac;color:#166534}.mode-help{font-size:11px;color:#64748b;line-height:1.6;margin:7px 2px 0}.row{display:flex;gap:8px;align-items:center;margin-top:10px}.mode-btn,.shuffle-btn,.clear-btn{border:1px solid var(--border);background:#fff;border-radius:11px;padding:9px 11px;font-size:12px;font-weight:800;color:#475569;cursor:pointer}.mode-btn.active{background:#fff7ed;border-color:#fdba74;color:#9a3412}.shuffle-btn{margin-left:auto}.status{font-size:12px;color:var(--muted);padding:8px 0 3px}.card{background:#fff;border:1px solid var(--border);border-radius:20px;padding:20px 17px;box-shadow:0 6px 24px rgba(15,23,42,.06);margin:12px 0}.meta{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:13px}.chip{display:inline-flex;align-items:center;padding:4px 9px;border-radius:999px;background:#f8fafc;border:1px solid var(--border);font-size:11px;font-weight:800;color:#475569}.context{display:none;margin:2px 0 15px;padding:12px 13px;border:1px solid #c7d2fe;border-radius:14px;background:#f8faff;color:#334155;font-size:13px;line-height:1.75}.context.show{display:block}.context-label{font-size:11px;font-weight:900;color:#4338ca;margin-bottom:5px}.statement{font-size:18px;line-height:1.9;font-weight:750;overflow-wrap:anywhere;word-break:normal;min-height:150px;display:flex;align-items:center}.prompt{text-align:center;color:var(--muted);font-size:13px;margin:15px 0 10px}.answers{display:grid;grid-template-columns:1fr 1fr;gap:10px}.answer-btn{min-height:70px;border-radius:16px;border:1.5px solid var(--border);background:#fff;font-size:17px;font-weight:900;cursor:pointer;-webkit-tap-highlight-color:transparent}.answer-btn.true{color:#166534}.answer-btn.false{color:#9f1239}.answer-btn:disabled{opacity:.55;cursor:default}.answer-btn.selected.true{background:var(--okbg);border-color:#4ade80}.answer-btn.selected.false{background:var(--ngbg);border-color:#fb7185}.feedback{display:none;margin-top:16px;border-radius:15px;padding:14px;border:1px solid var(--border);font-size:14px;line-height:1.75}.feedback.show{display:block}.feedback.good{background:var(--okbg);border-color:#86efac}.feedback.bad{background:var(--ngbg);border-color:#fda4af}.result-title{font-size:17px;font-weight:900;margin-bottom:7px}.explain{margin-top:10px;padding-top:10px;border-top:1px dashed #cbd5e1}.explain del{color:#64748b;text-decoration-color:#ef4444;text-decoration-thickness:2px}.explain .ins,.explain .insline{color:#dc2626;font-weight:800}.correctline{margin-top:7px}.next{width:100%;margin-top:13px;min-height:50px;border:0;border-radius:14px;background:#111827;color:#fff;font-weight:850;cursor:pointer;display:none}.next.show{display:block}.empty,.loading{background:#fff;border:1px solid var(--border);border-radius:18px;padding:28px 20px;margin:16px 0;text-align:center;color:#475569;line-height:1.7}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:10px 0 0}.stat{background:#fff;border:1px solid var(--border);border-radius:13px;padding:10px;text-align:center}.stat strong{display:block;font-size:18px}.stat span{font-size:11px;color:var(--muted)}.note{font-size:11px;color:#94a3b8;line-height:1.6;margin:13px 3px 24px}@media(max-width:520px){.seg,.quick{grid-template-columns:repeat(2,1fr)}.statement{font-size:16px;line-height:1.8;min-height:170px}.card{padding:18px 15px}.answer-btn{min-height:66px}}@media(min-width:700px){.brand h1{font-size:21px}.statement{font-size:20px;min-height:180px}.card{padding:26px 28px}}
</style>
</head>
<body>
<header class="topbar"><div class="wrap head"><div class="brand"><h1>○×暗記シート</h1><div class="sub">主任技師等任用候補者選考</div></div><a class="portal" href="https://0213mano-png.github.io/quiz_portal/">テスト一覧</a></div><div class="wrap"><div class="progress-row"><span id="progressText">読み込み中</span><span id="accuracyText">正答率 --%</span></div><div class="track"><div class="bar" id="progressBar"></div></div></div></header>
<main class="wrap">
<section class="controls-panel">
<div class="control-label">出題範囲</div>
<div class="seg" id="scopeButtons"><button data-scope="all" class="active">全範囲</button><button data-scope="front">前半</button><button data-scope="back">後半</button><button data-scope="mock">模擬試験</button></div>
<div class="control-label spaced">短時間モード</div>
<div class="quick" id="quickModes"><button data-mode="normal" class="active">通常</button><button data-mode="weak10">弱点10問</button><button data-mode="numeric10">数値10問</button><button data-mode="random10">ランダム10問</button></div>
<div class="mode-help" id="modeHelp">通常モード：選択した範囲をすべてランダム出題します。</div>
<div class="row"><button class="mode-btn" id="mistakeMode">苦手だけ</button><button class="clear-btn" id="clearMistakes">苦手を解除</button><button class="shuffle-btn" id="shuffleBtn">↻ シャッフル</button></div>
<div class="status" id="sourceStatus">問題データを読み込んでいます…</div>
</section>
<div id="loading" class="loading">問題データを準備しています。</div>
<section id="quizCard" class="card" hidden><div class="meta"><span class="chip" id="sourceChip"></span><span class="chip" id="originChip"></span><span class="chip" id="modeChip"></span><span class="chip" id="weakChip" hidden>苦手登録中</span></div><div class="context" id="contextBox"><div class="context-label">元の設問</div><div id="contextText"></div></div><div class="statement" id="statement"></div><div class="prompt">この文章は正しい？ 誤っている？</div><div class="answers"><button class="answer-btn true" data-answer="true">○ 正しい</button><button class="answer-btn false" data-answer="false">× 誤っている</button></div><div class="feedback" id="feedback"><div class="result-title" id="resultTitle"></div><div id="resultText"></div><div class="explain" id="explanation" hidden></div></div><button class="next" id="nextBtn">次の問題へ →</button></section>
<div id="empty" class="empty" hidden></div>
<section class="stats"><div class="stat"><strong id="answeredStat">0</strong><span>回答</span></div><div class="stat"><strong id="correctStat">0</strong><span>正解</span></div><div class="stat"><strong id="mistakeStat">0</strong><span>苦手</span></div></section>
<div class="note">学習履歴・苦手情報は、各自が使っているPCまたはスマートフォンのブラウザ内に保存されます。弱点10問は誤答回数・直近の誤答・未克服問題を優先し、履歴が少ない場合は未学習問題を補います。数値問題では元の設問も表示します。</div>
</main>
<script>
const SOURCES={front:{label:'確認テスト 前半',base:'/quiz1',parts:4},back:{label:'確認テスト 後半',base:'/quiz2',parts:5},mock:{label:'模擬試験',page:'/quiz3_suffle/'}};
const NUMERIC_MOCK_QIDS=new Set([41,46,48]);
const MODE_LABELS={normal:'通常',weak10:'弱点10問',numeric10:'数値10問',random10:'ランダム10問'};
let allItems=[],deck=[],index=0,current=null,scope='all',mistakeOnly=false,quickMode='normal',answered=0,correctCount=0;
let mistakes=new Set();
let history={};
try{mistakes=new Set(JSON.parse(localStorage.getItem('memorizeMistakes')||'[]'));}catch(e){mistakes=new Set();}
try{history=JSON.parse(localStorage.getItem('memorizeHistory')||'{}')||{};}catch(e){history={};}
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
function clean(s){return String(s||'').replace(/\n\s*/g,'').replace(/[ \t]{2,}/g,' ').trim();}
function saveMistakes(){localStorage.setItem('memorizeMistakes',JSON.stringify([...mistakes]));}
function saveHistory(){localStorage.setItem('memorizeHistory',JSON.stringify(history));}
function shuffle(a){a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
async function getText(url){const r=await fetch(url+(url.includes('?')?'&':'?')+'v='+Date.now(),{cache:'no-store'});if(!r.ok)throw new Error(url+' '+r.status);return r.text();}
async function loadPushData(src){const w={QUIZ_DATA:[]};for(let i=1;i<=src.parts;i++){const js=await getText(src.base+'/quiz-data-'+i+'.js');new Function('window',js)(w);}return w.QUIZ_DATA;}
function extractArray(script){const m=script.match(/const\s+DATA\s*=\s*/);if(!m)throw new Error('DATA not found');let p=m.index+m[0].length;while(script[p]!=='['&&p<script.length)p++;const start=p;let depth=0,quote=null,esc=false;for(;p<script.length;p++){const ch=script[p];if(quote){if(esc){esc=false;continue}if(ch==='\\'){esc=true;continue}if(ch===quote)quote=null;continue}if(ch==='"'||ch==="'"||ch==='`'){quote=ch;continue}if(ch==='[')depth++;if(ch===']'){depth--;if(depth===0)return script.slice(start,p+1);}}throw new Error('DATA array incomplete');}
async function loadMock(src){const html=await getText(src.page);const blocks=[...html.matchAll(/<script[^>]*>([\s\S]*?)<\/script>/gi)].map(x=>x[1]);const script=blocks.find(x=>/const\s+DATA\s*=/.test(x));if(!script)throw new Error('mock DATA not found');return JSON.parse(extractArray(script));}
function inferTruth(q,o,idx){if(q.type==='select-incorrect')return !Boolean(o.correct);if(q.type==='select-correct')return Boolean(o.correct);if(typeof q.correct==='number')return idx+1===q.correct;if(typeof o.correct==='boolean')return Boolean(o.correct);return null;}
function isNumericQuestion(key,q){return key==='mock'&&NUMERIC_MOCK_QIDS.has(Number(q.id));}
function flatten(data,key){const items=[];data.forEach(q=>{(q.options||[]).forEach((raw,idx)=>{const o=typeof raw==='string'?{text:raw}:raw;const truth=inferTruth(q,o,idx);if(truth===null)return;const text=clean(o.text||o.label||raw);if(!text)return;items.push({id:key+'-'+q.id+'-'+(idx+1),source:key,sourceLabel:SOURCES[key].label,qid:q.id,oid:idx+1,statement:text,truth,explanation:o.explanation_html||'',context:clean(q.title||q.body||''),showContext:isNumericQuestion(key,q)});});});return items;}
async function loadAll(){const status=$('#sourceStatus'),results=[];for(const key of ['front','back','mock']){try{const data=key==='mock'?await loadMock(SOURCES[key]):await loadPushData(SOURCES[key]);const items=flatten(data,key);allItems.push(...items);results.push(SOURCES[key].label+' '+items.length+'文');}catch(e){console.error(e);results.push(SOURCES[key].label+' 読込失敗');}}status.textContent=results.join(' / ');$('#loading').hidden=true;rebuild();}
function scopePool(){return scope==='all'?allItems:allItems.filter(x=>x.source===scope);}
function getHistory(id){return history[id]||{attempts:0,correct:0,wrong:0,lastWrong:0,lastAnswered:0};}
function weakScore(item){const h=getHistory(item.id);const age=h.lastWrong?Math.min(30,(Date.now()-h.lastWrong)/86400000):30;return(mistakes.has(item.id)?1000:0)+(h.wrong||0)*120+(h.attempts?((h.wrong||0)/h.attempts)*100:0)+(30-age)*2-(h.correct||0)*3;}
function weakTen(pool){const learned=pool.filter(x=>mistakes.has(x.id)||(getHistory(x.id).wrong||0)>0).sort((a,b)=>weakScore(b)-weakScore(a));const picked=learned.slice(0,10);if(picked.length<10){const used=new Set(picked.map(x=>x.id));const supplement=shuffle(pool.filter(x=>!used.has(x.id))).sort((a,b)=>(getHistory(a.id).attempts||0)-(getHistory(b.id).attempts||0));picked.push(...supplement.slice(0,10-picked.length));}return picked;}
function buildDeck(){let p=scopePool();if(quickMode==='weak10')return weakTen(p);if(quickMode==='numeric10')return shuffle(p.filter(x=>x.showContext)).slice(0,10);if(quickMode==='random10')return shuffle(p).slice(0,10);if(mistakeOnly)p=p.filter(x=>mistakes.has(x.id));return shuffle(p);}
function rebuild(){deck=buildDeck();index=0;answered=0;correctCount=0;updateStats();show();updateModeHelp();}
function completedMessage(){const pct=answered?Math.round(correctCount/answered*100):0;return 'このセットは終了です。<br><strong>'+answered+'問中 '+correctCount+'問正解（'+pct+'%）</strong><br>「↻ シャッフル」で新しいセットを開始できます。';}
function emptyMessage(){if(quickMode==='numeric10')return 'この出題範囲には対象となる数値問題がありません。<br>「全範囲」または「模擬試験」を選んでください。';if(mistakeOnly)return 'この範囲に苦手登録中の問題はありません。<br>「苦手だけ」を解除すると全問題を解けます。';return '出題できる問題がありません。';}
function show(){resetAnswerUI();if(!deck.length){$('#quizCard').hidden=true;$('#empty').hidden=false;$('#empty').innerHTML=emptyMessage();updateProgress();return;}if(index>=deck.length){current=null;$('#quizCard').hidden=true;$('#empty').hidden=false;$('#empty').innerHTML=completedMessage();updateProgress(true);return;}$('#empty').hidden=true;$('#quizCard').hidden=false;current=deck[index];$('#sourceChip').textContent=current.sourceLabel;$('#originChip').textContent='元問題 '+current.qid+'・選択肢 '+current.oid;$('#modeChip').textContent=MODE_LABELS[quickMode]+(quickMode==='normal'&&mistakeOnly?'・苦手だけ':'');$('#weakChip').hidden=!mistakes.has(current.id);$('#statement').textContent=current.statement;const box=$('#contextBox');if(current.showContext&&current.context){$('#contextText').textContent=current.context;box.classList.add('show');}else{box.classList.remove('show');$('#contextText').textContent='';}$('#nextBtn').textContent=index===deck.length-1?'結果を見る →':'次の問題へ →';updateProgress();}
function resetAnswerUI(){$$('.answer-btn').forEach(b=>{b.disabled=false;b.classList.remove('selected')});$('#feedback').className='feedback';$('#nextBtn').classList.remove('show');$('#explanation').hidden=true;$('#explanation').innerHTML='';}
function recordAnswer(item,ok){const h=getHistory(item.id);h.attempts=(h.attempts||0)+1;h.lastAnswered=Date.now();if(ok)h.correct=(h.correct||0)+1;else{h.wrong=(h.wrong||0)+1;h.lastWrong=Date.now();}history[item.id]=h;saveHistory();}
function answer(value,btn){if(!current)return;$$('.answer-btn').forEach(b=>b.disabled=true);btn.classList.add('selected');const ok=value===current.truth;answered++;if(ok){correctCount++;mistakes.delete(current.id);}else mistakes.add(current.id);recordAnswer(current,ok);saveMistakes();$('#weakChip').hidden=!mistakes.has(current.id);const f=$('#feedback');f.className='feedback show '+(ok?'good':'bad');$('#resultTitle').textContent=ok?'✅ 正解':'❌ 不正解';$('#resultText').textContent=current.truth?'この文章は正しい内容です。':'この文章は誤っている内容です。';const exp=$('#explanation');if(current.explanation){exp.innerHTML=current.explanation;exp.hidden=false;}else if(!current.truth&&current.showContext){exp.textContent='数値問題は、上の元設問と選択肢を合わせて確認してください。';exp.hidden=false;}$('#nextBtn').classList.add('show');updateStats();updateProgress();}
function next(){index++;show();window.scrollTo({top:0,behavior:'smooth'});}
function updateProgress(done=false){const total=deck.length;const pos=done?total:(total?Math.min(index+1,total):0);$('#progressText').textContent=total?'問題 '+pos+' / '+total:'問題 0 / 0';$('#progressBar').style.width=total?(pos/total*100)+'%':'0%';$('#accuracyText').textContent=answered?'正答率 '+Math.round(correctCount/answered*100)+'%':'正答率 --%';}
function updateStats(){$('#answeredStat').textContent=answered;$('#correctStat').textContent=correctCount;$('#mistakeStat').textContent=mistakes.size;}
function updateModeHelp(){const el=$('#modeHelp');if(quickMode==='weak10')el.textContent='弱点10問：この端末の誤答回数・直近の誤答・未克服問題を優先します。履歴が少ない場合は未学習問題を補います。';else if(quickMode==='numeric10')el.textContent='数値10問：数値を問う問題から最大10問を出題します。元の設問も一緒に表示します。';else if(quickMode==='random10')el.textContent='ランダム10問：選択した範囲から10問だけランダムに出題します。';else el.textContent='通常モード：選択した範囲をすべてランダム出題します。';}
function setQuickMode(mode){quickMode=mode;mistakeOnly=false;$('#mistakeMode').classList.remove('active');$$('#quickModes button').forEach(b=>b.classList.toggle('active',b.dataset.mode===mode));rebuild();}
$$('.answer-btn').forEach(b=>b.addEventListener('click',()=>answer(b.dataset.answer==='true',b)));
$('#nextBtn').addEventListener('click',next);
$('#shuffleBtn').addEventListener('click',rebuild);
$('#mistakeMode').addEventListener('click',()=>{quickMode='normal';$$('#quickModes button').forEach(b=>b.classList.toggle('active',b.dataset.mode==='normal'));mistakeOnly=!mistakeOnly;$('#mistakeMode').classList.toggle('active',mistakeOnly);rebuild();});
$('#clearMistakes').addEventListener('click',()=>{if(confirm('現在の苦手登録をすべて解除しますか？\n学習履歴（弱点10問の判定用）は残ります。')){mistakes.clear();saveMistakes();rebuild();}});
$('#scopeButtons').addEventListener('click',e=>{const b=e.target.closest('button[data-scope]');if(!b)return;scope=b.dataset.scope;$$('#scopeButtons button').forEach(x=>x.classList.toggle('active',x===b));rebuild();});
$('#quickModes').addEventListener('click',e=>{const b=e.target.closest('button[data-mode]');if(!b)return;setQuickMode(b.dataset.mode);});
loadAll();
</script>
</body>
</html>
